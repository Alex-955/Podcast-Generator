name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const targets = ['server.js'];
            for (const dir of ['src/services', 'public', 'scripts', 'electron']) {
              if (!fs.existsSync(dir)) continue;
              for (const entry of fs.readdirSync(dir)) {
                if (entry.endsWith('.js')) targets.push(path.join(dir, entry));
              }
            }
            for (const file of targets) {
              execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
            }
          "

      - name: Run offline tests
        env:
          # Node 22 treats flags after test/*.test.js as path patterns; set reporter via NODE_OPTIONS.
          NODE_OPTIONS: --test-reporter=spec
        run: npm test
