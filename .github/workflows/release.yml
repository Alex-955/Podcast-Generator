name: Release v1.0 Desktop & Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Build Portable Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline test suite
        run: npm test

      - name: Verify release tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Build portable archives with dependencies and run security gate
        run: node scripts/build-release.js --out-dir dist --with-deps --format both

      - name: Verify SHA-256 checksums
        run: (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz

  desktop-mac:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build:mac
      - run: node scripts/verify-desktop-bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: dist/*.dmg
          if-no-files-found: error

  desktop-win:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build:win
      - run: node scripts/verify-desktop-bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: dist/*.exe
          if-no-files-found: error

  publish:
    needs: [portable, desktop-mac, desktop-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify all five release artifacts
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('../package.json').version")
          files=("AI-Miaoting-v${version}-mac-arm64.dmg" "AI-Miaoting-v${version}-mac-x64.dmg"
                 "AI-Miaoting-v${version}-win-x64-setup.exe" *.zip *.tar.gz)
          test "${#files[@]}" -eq 5
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ai-miaoting-release
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
